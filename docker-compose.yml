services:
  postgres:
    image: postgres:16
    container_name: mvm-facturas-db
    environment:
      POSTGRES_USER: mvm
      POSTGRES_PASSWORD: mvm_secret
      POSTGRES_DB: mvm_facturas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

volumes:
  postgres_data:
